name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets
      - run: cargo run -- check examples/basic.mt
      - run: cargo run -- check examples/query.mt
      - run: cargo run -- run examples/query.mt
      - run: cargo run -- check examples/modules/main.mt
      - run: cargo run -- run examples/modules/main.mt
