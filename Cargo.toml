[package]
name = "my-tags"
version = "0.1.0"
edition = "2024"
description = "A small language for typed structured annotations"
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
indexmap = "2.7"
logos = "0.15"
miette = { version = "7.5", features = ["fancy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
insta = "1.42"
proptest = "1.6"
tempfile = "3.15"
